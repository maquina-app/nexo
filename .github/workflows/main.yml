name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Tests (Ruby ${{ matrix.ruby }})
    strategy:
      matrix:
        ruby:
          - '3.3'
          - '4.0'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the test suite
        run: bundle exec rake test

  lint:
    runs-on: ubuntu-latest
    name: Lint (StandardRB)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Run StandardRB
        run: bundle exec standardrb

  docs:
    runs-on: ubuntu-latest
    name: Docs (RDoc coverage)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Fail on any undocumented public API
        run: bundle exec rake doc:coverage

  container:
    runs-on: ubuntu-latest
    name: Container sandbox (live, Docker)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Run the live container tests against the runner's Docker
        env:
          NEXO_LIVE: '1'
        run: |
          docker pull alpine
          for file in container_live_test container_reconnect_smoke container_runner_test; do
            bundle exec ruby -Itest "test/sandboxes/$file.rb"
          done
