name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Tests (Ruby ${{ matrix.ruby }})
    strategy:
      matrix:
        ruby:
          - '3.3'
          - '4.0.0'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the test suite
        run: bundle exec rake test

  lint:
    runs-on: ubuntu-latest
    name: Lint (StandardRB)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.0'
          bundler-cache: true
      - name: Run StandardRB
        run: bundle exec standardrb

  docs:
    runs-on: ubuntu-latest
    name: Docs (RDoc coverage)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.0'
          bundler-cache: true
      - name: Fail on any undocumented public API
        run: bundle exec rake doc:coverage
